<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Video Cataloger</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        z-index: 2147483647;
      }
      #app-splash .splash-name { font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }
      #app-splash .splash-spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(0, 122, 255, 0.25);
        border-top-color: #007aff;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #app-splash { background: #1c1c1e; color: #f5f5f7; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2.5" y="4.5" width="19" height="15" rx="3" stroke="#007aff" stroke-width="1.6" />
          <path d="M10 9.2v5.6l4.8-2.8L10 9.2Z" fill="#007aff" />
        </svg>
        <div class="splash-name">AI Video Cataloger</div>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

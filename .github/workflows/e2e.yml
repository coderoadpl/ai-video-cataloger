name: e2e

# On-demand only. The `cli` project drives real videos through the real analyzer
# (a logged-in `claude` CLI) and local `whisper`, and asserts keywords a model
# produced — none of which an ephemeral runner has, and the last of which is
# nondeterministic. Under the flake doctrine that disqualifies it as a per-PR
# gate, so it keeps its workflow and its runner but is dispatched by hand, from a
# machine that carries the tools (docs/decisions/0017-hosted-ci-runners.md).
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-cli:
    name: e2e-cli
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e:cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-cli-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

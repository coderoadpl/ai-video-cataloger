name: check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # Native arm64, the architecture the packaged build (Electron + onnxruntime)
    # targets (docs/decisions/0017-hosted-ci-runners.md).
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # The hosted rasterizer is not the machine that authored the darwin
      # baselines, so the visual gate compares against its own set (ADR-0005 (f)).
      VISUAL_ENV: ci-macos-15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      # No `version:` input — the packageManager pin is the single source. Must
      # precede setup-node, which needs a pnpm on PATH to locate the store cache.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm run check
      # Advisory only: high/critical findings are triaged, but audit's transitive
      # noise must not break the build.
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: check-visual-artifacts
          path: |
            test-results
            visual/__screenshots__/ci-macos-15
          retention-days: 7
          if-no-files-found: ignore
